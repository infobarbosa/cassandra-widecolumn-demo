#
# Execução local do laboratório (Apêndice D do README): um container com o
# code-server e um nó Cassandra, com as duas keyspaces do curso carregadas no
# primeiro boot.
#
#   docker compose up -d
#
# Depois, abra http://localhost:8080 no navegador.
#
name: cassandra-widecolumn-demo
services:
  cassandra-lab:
    container_name: cassandra-lab
    image: ghcr.io/infobarbosa/cassandra-lab-docker-image:versao-inicial
    ports:
      - "8080:8080"
    # Tempo para o nodetool drain descarregar as memtables ao parar o container.
    stop_grace_period: 60s
